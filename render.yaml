# Render Blueprint — lets you deploy the backend with "New + Blueprint" on render.com,
# pointing at this repo, instead of configuring every field by hand.
# See DEPLOYMENT.md for the full step-by-step walkthrough.
#
# DATABASE_URL and DIRECT_URL are Neon Postgres connection strings (pooled and direct,
# respectively — see backend/prisma/schema.prisma) and are set manually per-environment
# rather than committed here, so they're marked `sync: false`.
services:
  - type: web
    name: family-expense-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
